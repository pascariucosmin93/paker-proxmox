name: Packer - Build Proxmox Template

on:
  push:
    branches: [main, master]
    paths:
      - "**.pkr.hcl"
      - "http/**"
      - ".github/workflows/packer.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.pkr.hcl"
      - "http/**"

env:
  PACKER_VERSION: "1.11.0"

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Write SSH key
        run: |
          echo "${{ secrets.PACKER_SSH_PRIVATE_KEY }}" > .tmp_packer_key
          chmod 600 .tmp_packer_key

      - name: Inject SSH public key into autoinstall
        run: |
          ssh-keygen -y -f .tmp_packer_key > .tmp_packer_key.pub
          sed -i "s|PACKER_SSH_PUBLIC_KEY|$(cat .tmp_packer_key.pub)|" http/user-data

      - name: Packer Init
        run: packer init ubuntu-server.pkr.hcl

      - name: Packer Validate
        run: packer validate ubuntu-server.pkr.hcl
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          PKR_VAR_user_password: ${{ secrets.COSMIN_PASSWORD }}
          PKR_VAR_autoinstall_url: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/http/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f .tmp_packer_key .tmp_packer_key.pub

  build:
    name: Build Template
    runs-on: [self-hosted, linux]   # 👈 AICI
    needs: validate
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Write SSH key
        run: |
          echo "${{ secrets.PACKER_SSH_PRIVATE_KEY }}" > .tmp_packer_key
          chmod 600 .tmp_packer_key

      - name: Inject SSH public key into autoinstall
        run: |
          ssh-keygen -y -f .tmp_packer_key > .tmp_packer_key.pub
          sed -i "s|PACKER_SSH_PUBLIC_KEY|$(cat .tmp_packer_key.pub)|" http/user-data

      - name: Packer Init
        run: packer init ubuntu-server.pkr.hcl

      - name: Packer Build
        run: packer build -force ubuntu-server.pkr.hcl
        timeout-minutes: 60
        env:
          PKR_VAR_proxmox_api_url: ${{ secrets.PROXMOX_API_URL }}
          PKR_VAR_proxmox_api_token_id: ${{ secrets.PROXMOX_TOKEN_ID }}
          PKR_VAR_proxmox_api_token_secret: ${{ secrets.PROXMOX_TOKEN_SECRET }}
          PKR_VAR_user_password: ${{ secrets.COSMIN_PASSWORD }}
          PKR_VAR_autoinstall_url: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/http/"

      - name: Cleanup SSH key
        if: always()
        run: rm -f .tmp_packer_key .tmp_packer_key.pub
